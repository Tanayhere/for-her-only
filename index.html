<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You 💕</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd1dc, #ffb6c1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Comic Sans MS', 'Poppins', cursive;
    }
    .card {
      background: #fff0f5;
      padding: 30px 25px;
      border-radius: 25px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      max-width: 420px;
      text-align: center;
    }
    h1 {
      color: #ff69b4;
      margin-bottom: 10px;
    }
    p {
      color: #6b2c4f;
      font-size: 18px;
      line-height: 1.5;
    }
    .cats {
      font-size: 32px;
      margin: 15px 0;
    }
    .heart {
      font-size: 22px;
      color: #ff69b4;
      margin-top: 10px;
    }
    footer {
      margin-top: 20px;
      font-size: 14px;
      color: #aa5c88;
    }
  </style>
</head>

<body>

  <!-- Music (hidden) -->
  <div id="bgm"></div>

  <div class="card">
    <h1>Hey bbg 💕</h1>
    <div class="cats">🐱🐾🐱</div>
    <p>
      Hope you're well 💖<br>
      Just a little message made only for you 🌸<br>
      If you’re reading this, someone really wanted you to smile today ✨
    </p>
    <div class="heart">💗💗💗</div>
    <footer>
      always cheering for you 🌷 (tap anywhere 💗)
    </footer>
  </div>

  <!-- YouTube API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;
    let started = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('bgm', {
        height: '0',
        width: '0',
        videoId: 'H2f7MZaw3Yo', // NEW MUSIC
        playerVars: {
          autoplay: 0,
          loop: 1,
          playlist: 'H2f7MZaw3Yo',
          controls: 0,
          enablejsapi: 1
        }
      });
    }

    document.addEventListener("click", function () {
      if (!started && player) {
        player.setVolume(15); // soft volume
        player.playVideo();
        started = true;
      }
    });
  </script>

</body>
</html>
