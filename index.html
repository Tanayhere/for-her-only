<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You 💕</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    <iframe
  width="0"
  height="0"
  src="https://www.youtube.com/embed/Wp2NMRS5TAo?autoplay=1&loop=1&playlist=Wp2NMRS5TAo&controls=0&modestbranding=1"
  frameborder="0"
  allow="autoplay"
></iframe>

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd1dc, #ffb6c1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Comic Sans MS', 'Poppins', cursive;
    }
    .card {
      background: #fff0f5;
      padding: 30px 25px;
      border-radius: 25px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      max-width: 420px;
      text-align: center;
    }
    h1 {
      color: #ff69b4;
      margin-bottom: 10px;
    }
    p {
      color: #6b2c4f;
      font-size: 18px;
      line-height: 1.5;
    }
    .cats {
      font-size: 32px;
      margin: 15px 0;
    }
    .heart {
      font-size: 22px;
      color: #ff69b4;
      margin-top: 10px;
    }
    footer {
      margin-top: 20px;
      font-size: 14px;
      color: #aa5c88;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hey bbg 💕</h1>
    <div class="cats">🐱🐾🐱</div>
    <p>
      Hope you're well 💖<br>
      Just a little message made only for you 🌸<br>
      If you’re reading this, someone really wanted you to smile today ✨
    </p>
    <div class="heart">💗💗💗</div>
    <footer>
      always cheering for you 🌷
    </footer>
  </div>
</body>
</html>
